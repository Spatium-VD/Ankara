    <script>
        (function () {
            // Корень сайта на GitHub Pages. Подставляется при экспорте (export-github-pages-repo.js).
            var SITE_ROOT = '/Ankara/';

            var params = new URLSearchParams(window.location.search);
            var forced = params.get('client');
            if (forced === 'mobile' || forced === 'legacy') {
                try { localStorage.setItem('platform_client', 'mobile'); } catch (e) { /* ignore */ }
                if (forced === 'legacy') {
                    console.warn(
                        '[Ankara] ?client=legacy — vanilla QA archive only. Production mobile: ' + SITE_ROOT + 'mobile/',
                    );
                    window.location.replace(SITE_ROOT + 'legacy/' + qs + hash);
                    return;
                }
            } else if (forced === 'desktop' || forced === 'react') {
                try { localStorage.setItem('platform_client', 'desktop'); } catch (e) { /* ignore */ }
            }

            var qs = window.location.search || '';
            var hash = window.location.hash || '';
            var full = window.location.pathname;

            // Путь относительно корня сайта.
            var rel = full.indexOf(SITE_ROOT) === 0 ? full.slice(SITE_ROOT.length) : full.replace(/^\/+/, '');
            rel = rel.replace(/^\/+/, '').replace(/\/?index\.html?$/, '');
            var firstSeg = rel.split('/')[0];

            // Глубокая ссылка в desktop (React SPA), которую отдал корневой 404 → восстановить
            // маршрут на desktop/index.html через ?p=, без бесконечного редиректа.
            if (firstSeg === 'desktop') {
                var parts = rel.split('/').filter(function (s) {
                    return s && s !== 'desktop' && s !== 'mobile';
                });
                var sub = parts.join('/');
                var dest = SITE_ROOT + 'desktop/';
                if (sub) dest += '?p=/' + sub;
                window.location.replace(dest + (sub ? '' : qs) + hash);
                return;
            }

            // Глубокая ссылка в legacy QA archive.
            if (firstSeg === 'legacy') {
                console.warn(
                    '[Ankara] /legacy/ is vanilla QA archive. Production mobile: ' + SITE_ROOT + 'mobile/',
                );
                window.location.replace(SITE_ROOT + 'legacy/' + qs + hash);
                return;
            }

            // Глубокая ссылка в legacy mobile → корень mobile-клиента.
            if (firstSeg === 'mobile') {
                window.location.replace(SITE_ROOT + 'mobile/' + qs + hash);
                return;
            }

            // Корневой bootstrap: выбираем клиента по сохранённому выбору или ширине экрана.
            var pref = null;
            try { pref = localStorage.getItem('platform_client'); } catch (e) { /* ignore */ }

            var target;
            if (pref === 'mobile') target = 'mobile/';
            else if (pref === 'desktop') target = 'desktop/';
            else target = window.matchMedia('(max-width: 767px)').matches ? 'mobile/' : 'desktop/';

            window.location.replace(SITE_ROOT + target + qs + hash);
        })();
    </script>
